[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# build.format 'file' writes the Spanish home page to es.html; serve it at /es/.
[[redirects]]
  from = "/es/"
  to = "/es.html"
  status = 200

[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

# Images moved into folders in the revamp; keep the old URLs (search results, shared links) working.
[[redirects]]
